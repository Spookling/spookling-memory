name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance
    env:
      SPOOKLING_LOCAL_MODELS: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v6
      - name: The tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: uv sync --project server
      - run: uv run --project server pytest -q
      - run: npm test
      - name: Pack and smoke-test the release
        run: |
          package="$(npm pack --pack-destination "$RUNNER_TEMP")"
          mv "$RUNNER_TEMP/$package" "$RUNNER_TEMP/spookling-release.tgz"
          npm run test:release -- "$RUNNER_TEMP/spookling-release.tgz"
      - run: npm publish "$RUNNER_TEMP/spookling-release.tgz" --provenance --access public
        env:
          # Set NPM_TRUSTED_PUBLISHING after registering this workflow on npm.
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
