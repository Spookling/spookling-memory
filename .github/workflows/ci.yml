name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    env:
      SPOOKLING_LOCAL_MODELS: "0"  # offline: no embedder or reranker
      PYTHONUTF8: "1"              # or Python on Windows reads files as cp1252
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@v6  # uv fetches Python 3.12 itself
      - run: uv sync --project server
      - run: uv run --project server pytest -q
      - run: npm test
      - run: npm pack --dry-run
