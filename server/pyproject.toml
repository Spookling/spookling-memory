[project]
name = "spookling-memory"
version = "0.1.0"
description = "Spookling Memory: the memory algorithm (spookling_memory.core) and its local server (HTTP API, MCP tools, Claude Code hooks)"
requires-python = "==3.12.*"
dependencies = [
    # the server
    "fastapi",
    "uvicorn",
    "mcp",
    # the core: openai (OpenRouter client), anthropic (the Anthropic API backend), rank_bm25 (keyword search),
    # tiktoken (the recall budget), snowballstemmer (stemmed keyword index), numpy and scipy (activation's PageRank)
    "openai",
    "anthropic",
    "rank_bm25",
    "tiktoken",
    "snowballstemmer>=3.1.1",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
vectors = [  # the local embedder and reranker (core/vectors.py); without them search is keyword only
    "sentence-transformers>=3",
]

[project.scripts]
spookling-memory = "spookling_memory:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spookling_memory"]
