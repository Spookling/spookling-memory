[project]
name = "spookling-memory"
version = "0.1.0"
description = "Spookling Memory: the local memory server (HTTP API, MCP tools, Claude Code hooks) over memory-bench's spookling adapter"
requires-python = "==3.12.*"
dependencies = [
    "memory-bench",
    "fastapi",
    "uvicorn",
    "mcp",
    # the adapter's activation.py imports numpy and scipy, which memory-bench declares only through its vectors extra
    "numpy",
    "scipy",
]

[project.scripts]
spookling-memory = "spookling_memory:main"

[tool.uv.sources]
memory-bench = { path = "../../memory-bench", editable = true }  # vendored later (plan, repo layout)

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spookling_memory"]
